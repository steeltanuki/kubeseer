name: Continuous integration

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out the event revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ZERO_SHA="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            BASE_SHA="$PR_BASE_SHA"
          elif [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "$ZERO_SHA" ]]; then
            BASE_SHA="$PUSH_BEFORE_SHA"
          else
            # Safe fallback for the first push of a branch.
            # Treat the whole repository as changed rather than accidentally
            # skipping validation.
            BASE_SHA="$(git hash-object -t tree /dev/null)"
          fi

          echo "Comparing:"
          echo "  base: $BASE_SHA"
          echo "  head: $HEAD_SHA"

          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | tee /tmp/kubeseer-changed-files.txt

          if [[ ! -s /tmp/kubeseer-changed-files.txt ]]; then
            echo "No changed files detected."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "release_related=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          #
          # Documentation-only changes
          #
          # README files, Markdown files anywhere in the repository, and
          # everything under docs/ are considered documentation.
          #
          if grep -qvE '(^|/)(README|CHANGELOG|CONTRIBUTING)(\.[^/]*)?$|\.md$|^docs/' \
              /tmp/kubeseer-changed-files.txt; then
            DOCS_ONLY=false
          else
            DOCS_ONLY=true
          fi

          #
          # Changes that can affect release packaging or distribution.
          #
          if grep -qE \
              '(^\.github/workflows/|^charts/|^Dockerfile$|^hack/release-|^Makefile$|^go\.mod$|^go\.sum$)' \
              /tmp/kubeseer-changed-files.txt; then
            RELEASE_RELATED=true
          else
            RELEASE_RELATED=false
          fi

          echo "docs_only=$DOCS_ONLY"
          echo "release_related=$RELEASE_RELATED"

          echo "docs_only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"
          echo "release_related=$RELEASE_RELATED" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # Fast path: documentation-only changes
      # ---------------------------------------------------------------------

      - name: Validate documentation-only changes
        if: steps.changes.outputs.docs_only == 'true'
        shell: bash
        run: |
          set -euo pipefail

          echo "Documentation-only change detected."
          echo "Skipping Go, integration, and release-distribution tests."

          # Cheap but useful validation:
          # detects trailing whitespace and whitespace errors in patches.
          git diff --check

      # ---------------------------------------------------------------------
      # Normal project validation
      # ---------------------------------------------------------------------

      - name: Check release command compatibility before installing dependencies
        if: steps.changes.outputs.docs_only != 'true'
        run: ./hack/release-distribution.sh check-tools

      - name: Set up the Go version declared by go.mod
        if: steps.changes.outputs.docs_only != 'true'
        uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Download project modules for offline verification
        if: steps.changes.outputs.docs_only != 'true'
        run: go mod download

      - name: Install ripgrep for repository verification
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version

      - name: Verify generated files, package rules, and repository boundaries
        if: steps.changes.outputs.docs_only != 'true'
        run: make verify

      - name: Run the default integration test layer
        if: steps.changes.outputs.docs_only != 'true'
        run: make test

      # ---------------------------------------------------------------------
      # Release/distribution validation
      # ---------------------------------------------------------------------

      - name: Exercise release publication and recovery against a disposable registry
        if: steps.changes.outputs.release_related == 'true'
        run: make test-release-distribution SCENARIO=all