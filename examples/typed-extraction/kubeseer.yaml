apiVersion: kubeseer.io/v1alpha1
kind: Kubeseer
metadata:
  name: typed
  namespace: kubeseer-example-typed
  labels: {kubeseer.io/example: typed-extraction}
spec:
  sources:
    - id: deployment
      resource: {apiVersion: apps/v1, kind: Deployment}
      namespaces: {names: [kubeseer-example-typed]}
      selector: {name: typed}
      fields:
        - {name: createdAt, path: "{.metadata.creationTimestamp}", type: timestamp}
